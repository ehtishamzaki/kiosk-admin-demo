name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore KioskAdmin.sln
      - run: dotnet build KioskAdmin.sln -c Release --no-restore
      - run: dotnet test KioskAdmin.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet publish src/KioskAdmin -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: KioskAdmin
          path: publish
